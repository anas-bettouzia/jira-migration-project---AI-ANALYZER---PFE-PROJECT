<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 2200 2200">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#111827"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 24px; font-weight: 700; }
      .h { font-size: 16px; font-weight: 700; }
      .t { font-size: 13px; }
      .s { font-size: 12px; }
      .phaseTitle { font-size: 14px; font-weight: 700; }
      .actorBox { fill: #ffffff; stroke: #111827; stroke-width: 1.5; rx: 4; }
      .participant { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; rx: 4; }
      .dataBox { fill: #faf5ff; stroke: #7e22ce; stroke-width: 1.7; rx: 4; }
      .aiBox { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.7; rx: 4; }
      .frame { fill: none; stroke: #64748b; stroke-width: 1.25; rx: 3; }
      .frameLabel { fill: #ffffff; stroke: #64748b; stroke-width: 1.25; }
      .lifeline { stroke: #7c8da3; stroke-width: 1.35; stroke-dasharray: 7 7; }
      .call { stroke: #111827; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 1.55; fill: none; stroke-dasharray: 8 6; marker-end: url(#returnArrow); }
      .labelBg { fill: #ffffff; opacity: 0.96; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; rx: 4; }
    </style>
  </defs>

  <rect x="1" y="1" width="2198" height="2198" fill="#ffffff" stroke="#111827" stroke-width="1"/>

