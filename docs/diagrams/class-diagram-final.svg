<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1400" viewBox="0 0 2600 1400">
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#0f172a"/>
    </marker>
    <marker id="depArrow" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="enumArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="diamond" markerWidth="18" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,7 L9,1 L16,7 L9,13 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
    </marker>
    <style>
      .page { fill: #fff; }
      .outer-frame { fill: none; stroke: #0f172a; stroke-width: 2; }
      .title-tab { fill: #fff; stroke: #0f172a; stroke-width: 2; }
      .main-class { fill: #eef6ff; stroke: #2563ff; stroke-width: 1.8; }
      .support-class { fill: #fff7ed; stroke: #c0843d; stroke-width: 1.7; }
      .note-box { fill: #fffaf0; stroke: #c0843d; stroke-width: 1.8; }
      .legend-box { fill: #fff; stroke: #2563ff; stroke-width: 1.7; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .class-name { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .attr { font-family: Arial, Helvetica, sans-serif; font-size: 16.5px; font-weight: 400; fill: #0f172a; }
      .op { font-family: Arial, Helvetica, sans-serif; font-size: 16.5px; font-weight: 400; fill: #0f172a; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 500; fill: #0f172a; }
      .mult { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .legend-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
      .legend-text { font-family: Arial, Helvetica, sans-serif; font-size: 14.5px; font-weight: 400; fill: #0f172a; }
      .enum-class { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .enum-name { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .enum-stereo { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .enum-value { font-family: Arial, Helvetica, sans-serif; font-size: 14.5px; font-weight: 500; fill: #1e293b; letter-spacing: 0; }
      .sep-main { stroke: #2563ff; stroke-width: 1.1; }
      .sep-support { stroke: #c0843d; stroke-width: 1.1; }
      .assoc { stroke: #0f172a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .comp { stroke: #0f172a; stroke-width: 2; fill: none; marker-start: url(#diamond); }
      .dep { stroke: #334155; stroke-width: 1.8; stroke-dasharray: 9 8; fill: none; marker-end: url(#depArrow); }
      .enum-dep { stroke: #64748b; stroke-width: 1.35; stroke-dasharray: 5 5; fill: none; marker-end: url(#enumArrow); }
      .soft { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="page" width="2600" height="1400"/>
  <rect class="outer-frame" x="1.5" y="1.5" width="2597" height="1397"/>

  <!-- UML title tab -->
  <path class="title-tab" d="M10 10 H645 V35 L620 60 H10 Z"/>
  <text class="title" x="24" y="43">cd Diagramme de classes - Jira Migration AI Analyzer</text>

  <!-- Main classes row -->
  <g id="ApplicationUser">
    <rect class="main-class" x="25" y="245" width="170" height="230" rx="6"/>
    <line class="sep-main" x1="25" y1="285" x2="195" y2="285"/>
    <line class="sep-main" x1="25" y1="410" x2="195" y2="410"/>
    <text class="class-name" x="110" y="270" text-anchor="middle">User</text>
    <text class="attr" x="42" y="315">- userId: UUID</text>
    <text class="attr" x="42" y="345">- email: string</text>
    <text class="attr" x="42" y="375">- role: Role</text>
    <text class="op" x="42" y="445">+ updateProfile(): void</text>
  </g>

  <g id="AnalysisJob">
    <rect class="main-class" x="310" y="235" width="210" height="250" rx="6"/>
    <line class="sep-main" x1="310" y1="275" x2="520" y2="275"/>
    <line class="sep-main" x1="310" y1="410" x2="520" y2="410"/>
    <text class="class-name" x="415" y="260" text-anchor="middle">AnalysisJob</text>
    <text class="attr" x="330" y="305">- jobId: UUID</text>
    <text class="attr" x="330" y="335">- status: JobStatus</text>
    <text class="attr" x="330" y="365">- progress: int</text>
    <text class="attr" x="330" y="395">- createdAt: datetime</text>
    <text class="op" x="330" y="445">+ markCompleted(): void</text>
  </g>

  <g id="MigrationPackage">
    <rect class="main-class" x="620" y="235" width="230" height="250" rx="6"/>
    <line class="sep-main" x1="620" y1="275" x2="850" y2="275"/>
    <line class="sep-main" x1="620" y1="410" x2="850" y2="410"/>
    <text class="class-name" x="735" y="260" text-anchor="middle">MigrationPackage</text>
    <text class="attr" x="640" y="305">- packageId: UUID</text>
    <text class="attr" x="640" y="335">- packageName: string</text>
    <text class="attr" x="640" y="365">- uploadedAt: datetime</text>
    <text class="attr" x="640" y="395">- status: UploadStatus</text>
    <text class="op" x="640" y="445">+ validate(): bool</text>
  </g>

  <g id="MigrationFile">
    <rect class="main-class" x="955" y="270" width="200" height="185" rx="6"/>
    <line class="sep-main" x1="955" y1="310" x2="1155" y2="310"/>
    <line class="sep-main" x1="955" y1="405" x2="1155" y2="405"/>
    <text class="class-name" x="1055" y="295" text-anchor="middle">MigrationFile</text>
    <text class="attr" x="975" y="340">- fileId: UUID</text>
    <text class="attr" x="975" y="370">- fileName: string</text>
    <text class="attr" x="975" y="400">- fileType: FileType</text>
    <text class="op" x="975" y="440">+ validate(): bool</text>
  </g>

  <g id="ParsedData">
    <rect class="main-class" x="1245" y="270" width="205" height="185" rx="6"/>
    <line class="sep-main" x1="1245" y1="310" x2="1450" y2="310"/>
    <line class="sep-main" x1="1245" y1="405" x2="1450" y2="405"/>
    <text class="class-name" x="1348" y="295" text-anchor="middle">ParsedData</text>
    <text class="attr" x="1265" y="340">- dataId: UUID</text>
    <text class="attr" x="1265" y="370">- sourceType: FileType</text>
    <text class="attr" x="1265" y="400">- extractedAt: datetime</text>
    <text class="op" x="1265" y="440">+ toJson(): string</text>
  </g>

  <g id="ParsedComponent">
    <rect class="main-class" x="1535" y="265" width="230" height="230" rx="6"/>
    <line class="sep-main" x1="1535" y1="305" x2="1765" y2="305"/>
    <line class="sep-main" x1="1535" y1="435" x2="1765" y2="435"/>
    <text class="class-name" x="1650" y="290" text-anchor="middle">ParsedComponent</text>
    <text class="attr" x="1555" y="335">- componentId: string</text>
    <text class="attr" x="1555" y="365">- componentName: string</text>
    <text class="attr" x="1555" y="395">- componentType: string</text>
    <text class="attr" x="1555" y="425">- featuresDetected: string[]</text>
    <text class="op" x="1555" y="470">+ getSignature(): string</text>
  </g>

  <g id="ComponentCompatibilityResult">
    <rect class="main-class" x="1860" y="285" width="280" height="275" rx="6"/>
    <line class="sep-main" x1="1860" y1="342" x2="2140" y2="342"/>
    <line class="sep-main" x1="1860" y1="495" x2="2140" y2="495"/>
    <text class="class-name" x="2000" y="305" text-anchor="middle">
      <tspan x="2000" dy="0">ComponentCompatibility</tspan>
      <tspan x="2000" dy="22">Result</tspan>
    </text>
    <text class="attr" x="1880" y="367">- resultId: UUID</text>
    <text class="attr" x="1880" y="397">- componentName: string</text>
    <text class="attr" x="1880" y="427">- status: CompatibilityStatus</text>
    <text class="attr" x="1880" y="457">- severity: Severity</text>
    <text class="attr" x="1880" y="487">- recommendation: string</text>
    <text class="op" x="1880" y="530">+ isBlocker(): bool</text>
  </g>

  <g id="CompatibilityMatrix">
    <rect class="main-class" x="1780" y="10" width="310" height="205" rx="6"/>
    <line class="sep-main" x1="1780" y1="50" x2="2090" y2="50"/>
    <line class="sep-main" x1="1780" y1="150" x2="2090" y2="150"/>
    <text class="class-name" x="1935" y="35" text-anchor="middle">CompatibilityMatrix</text>
    <text class="attr" x="1800" y="80">- matrixId: UUID</text>
    <text class="attr" x="1800" y="110">- analyzedAt: datetime</text>
    <text class="attr" x="1800" y="140">- blockerCount: int</text>
    <text class="op" x="1800" y="185">+ getSummary(): dict</text>
  </g>

  <g id="MigrationReport">
    <rect class="main-class" x="2240" y="265" width="250" height="260" rx="6"/>
    <line class="sep-main" x1="2240" y1="305" x2="2490" y2="305"/>
    <line class="sep-main" x1="2240" y1="450" x2="2490" y2="450"/>
    <text class="class-name" x="2365" y="290" text-anchor="middle">MigrationReport</text>
    <text class="attr" x="2260" y="335">- reportId: UUID</text>
    <text class="attr" x="2260" y="365">- title: string</text>
    <text class="attr" x="2260" y="395">- generatedAt: datetime</text>
    <text class="attr" x="2260" y="425">- migrationScore: float</text>
    <text class="op" x="2260" y="485">+ toJson(): string</text>
  </g>

  <!-- Support classes row -->
  <g id="ComponentAnalysisCache">
    <rect class="support-class" x="1085" y="790" width="320" height="170" rx="6"/>
    <line class="sep-support" x1="1085" y1="842" x2="1405" y2="842"/>
    <text class="class-name" x="1245" y="808" text-anchor="middle">
      <tspan x="1245" dy="0">ComponentAnalysis</tspan>
      <tspan x="1245" dy="22">Cache</tspan>
    </text>
    <text class="attr" x="1105" y="875">- signature: string</text>
    <text class="attr" x="1105" y="905">- componentName: string</text>
    <text class="attr" x="1105" y="935">- finalStatus: CompatibilityStatus</text>
  </g>

  <g id="RagEvidence">
    <rect class="support-class" x="1470" y="790" width="260" height="170" rx="6"/>
    <line class="sep-support" x1="1470" y1="830" x2="1730" y2="830"/>
    <text class="class-name" x="1600" y="815" text-anchor="middle">RagEvidence</text>
    <text class="attr" x="1490" y="865">- evidenceId: UUID</text>
    <text class="attr" x="1490" y="895">- sourceType: string</text>
    <text class="attr" x="1490" y="925">- similarityScore: float</text>
  </g>

  <g id="AIAnalysisResult">
    <rect class="support-class" x="1770" y="790" width="280" height="170" rx="6"/>
    <line class="sep-support" x1="1770" y1="830" x2="2050" y2="830"/>
    <text class="class-name" x="1910" y="815" text-anchor="middle">AIAnalysisResult</text>
    <text class="attr" x="1790" y="865">- resultId: UUID</text>
    <text class="attr" x="1790" y="895">- summary: string</text>
    <text class="attr" x="1790" y="925">- riskLevel: Severity</text>
  </g>

  <g id="MigrationRecommendation">
    <rect class="support-class" x="2085" y="790" width="290" height="170" rx="6"/>
    <line class="sep-support" x1="2085" y1="842" x2="2375" y2="842"/>
    <text class="class-name" x="2230" y="808" text-anchor="middle">
      <tspan x="2230" dy="0">Migration</tspan>
      <tspan x="2230" dy="22">Recommendation</tspan>
    </text>
    <text class="attr" x="2105" y="875">- recommendationId: UUID</text>
    <text class="attr" x="2105" y="905">- priority: Severity</text>
    <text class="attr" x="2105" y="935">- action: string</text>
  </g>

  <g id="ArchivedReport">
    <rect class="support-class" x="2410" y="790" width="165" height="170" rx="6"/>
    <line class="sep-support" x1="2410" y1="830" x2="2575" y2="830"/>
    <text class="class-name" x="2492" y="815" text-anchor="middle" style="font-size:18px">Archived Report</text>
    <text class="attr" x="2425" y="865">- archiveId: UUID</text>
    <text class="attr" x="2425" y="895">- archivedAt</text>
    <text class="attr" x="2425" y="925">- reason: string</text>
  </g>

  <!-- Main associations -->
  <path class="assoc" d="M195 360 H310"/>
  <text class="label" x="252" y="332" text-anchor="middle">crée</text>
  <text class="mult" x="205" y="390">1</text>
  <text class="mult" x="275" y="390">0..*</text>

  <path class="assoc" d="M520 360 H620"/>
  <text class="label" x="570" y="332" text-anchor="middle">traite</text>
  <text class="mult" x="532" y="390">1</text>
  <text class="mult" x="594" y="390">1</text>

  <path class="comp" d="M850 360 H955"/>
  <text class="label" x="902" y="332" text-anchor="middle">contient</text>
  <text class="mult" x="868" y="390">1</text>
  <text class="mult" x="928" y="390">1..*</text>

  <path class="assoc" d="M1155 360 H1245"/>
  <text class="label" x="1200" y="332" text-anchor="middle">produit</text>
  <text class="mult" x="1168" y="390">1</text>
  <text class="mult" x="1218" y="390">1</text>

  <path class="comp" d="M1450 360 H1535"/>
  <text class="label" x="1492" y="332" text-anchor="middle">contient</text>
  <text class="mult" x="1465" y="390">1</text>
  <text class="mult" x="1510" y="390">1..*</text>

  <path class="assoc" d="M1765 380 H1860"/>
  <text class="label" x="1812" y="351" text-anchor="middle">référence</text>
  <text class="mult" x="1780" y="410">1</text>
  <text class="mult" x="1835" y="410">1</text>

  <path class="comp" d="M1935 215 V285"/>
  <text class="label" x="1975" y="250" text-anchor="middle">contient</text>
  <text class="mult" x="1905" y="240">1</text>
  <text class="mult" x="1962" y="278">1..*</text>

  <path class="assoc" d="M2140 390 H2240"/>
  <text class="label" x="2190" y="363" text-anchor="middle">alimente</text>
  <text class="mult" x="2145" y="420">1..*</text>
  <text class="mult" x="2215" y="420">1</text>

  <!-- Lower associations and dependencies -->
  <path class="assoc" d="M110 475 V585 H735 V485"/>
  <text class="label" x="390" y="577">importe</text>
  <text class="mult" x="125" y="505">1</text>
  <text class="mult" x="680" y="572">0..*</text>

  <path class="dep" d="M1860 535 H1245 V790"/>
  <text class="label" x="1288" y="522">peut provenir du cache</text>

  <path class="dep" d="M1975 560 V735 H1600 V790"/>
  <text class="label" x="1630" y="722">justifie par preuves RAG</text>

  <path class="assoc" d="M2000 560 V760 H1910 V790"/>
  <text class="label" x="2015" y="708">résultat IA</text>
  <text class="mult" x="2010" y="586">1</text>
  <text class="mult" x="1930" y="780">0..1</text>

  <path class="comp" d="M2365 525 V752 H2230 V790"/>
  <text class="label" x="2288" y="725" text-anchor="middle">recommandations</text>
  <text class="mult" x="2338" y="560">1</text>
  <text class="mult" x="2242" y="775">0..*</text>

  <path class="dep" d="M2490 485 H2525 V790"/>
  <text class="label" x="2452" y="718" text-anchor="middle">archivé comme</text>
  <text class="mult" x="2500" y="505">1</text>
  <text class="mult" x="2535" y="765">0..1</text>

  <!-- Enumerations -->
  <g id="Enums">
    <g id="RoleEnum">
      <rect class="enum-class" x="45" y="120" width="130" height="85" rx="5"/>
      <line class="soft" x1="45" y1="165" x2="175" y2="165"/>
      <text class="enum-stereo" x="110" y="140" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="110" y="158" text-anchor="middle">Role</text>
      <text class="enum-value" x="60" y="188">Consultant</text>
    </g>
    <g id="JobStatusEnum">
      <rect class="enum-class" x="335" y="115" width="160" height="90" rx="5"/>
      <line class="soft" x1="335" y1="160" x2="495" y2="160"/>
      <text class="enum-stereo" x="415" y="135" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="415" y="153" text-anchor="middle">JobStatus</text>
      <text class="enum-value" x="352" y="183">Pending</text>
      <text class="enum-value" x="352" y="202">Running</text>
    </g>
    <g id="UploadStatusEnum">
      <rect class="enum-class" x="650" y="115" width="170" height="90" rx="5"/>
      <line class="soft" x1="650" y1="160" x2="820" y2="160"/>
      <text class="enum-stereo" x="735" y="135" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="735" y="153" text-anchor="middle">UploadStatus</text>
      <text class="enum-value" x="668" y="183">Uploaded</text>
      <text class="enum-value" x="668" y="202">Validated</text>
    </g>
    <g id="FileTypeEnum">
      <rect class="enum-class" x="980" y="515" width="150" height="90" rx="5"/>
      <line class="soft" x1="980" y1="560" x2="1130" y2="560"/>
      <text class="enum-stereo" x="1055" y="535" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="1055" y="553" text-anchor="middle">FileType</text>
      <text class="enum-value" x="998" y="583">Zip</text>
      <text class="enum-value" x="998" y="602">XML / JSON</text>
    </g>
    <g id="CompatibilityStatusEnum">
      <rect class="enum-class" x="1760" y="585" width="200" height="90" rx="5"/>
      <line class="soft" x1="1760" y1="628" x2="1960" y2="628"/>
      <text class="enum-stereo" x="1860" y="605" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="1860" y="622" text-anchor="middle">CompatibilityStatus</text>
      <text class="enum-value" x="1780" y="654">Compatible</text>
      <text class="enum-value" x="1780" y="673">Warning / Blocker</text>
    </g>
    <g id="SeverityEnum">
      <rect class="enum-class" x="2080" y="585" width="155" height="90" rx="5"/>
      <line class="soft" x1="2080" y1="628" x2="2235" y2="628"/>
      <text class="enum-stereo" x="2158" y="605" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
      <text class="enum-name" x="2158" y="622" text-anchor="middle">Severity</text>
      <text class="enum-value" x="2100" y="654">Low</text>
      <text class="enum-value" x="2100" y="673">High</text>
    </g>
  </g>

  <!-- Short enumeration dependencies -->
  <path class="enum-dep" d="M110 245 V205"/>
  <path class="enum-dep" d="M415 235 V205"/>
  <path class="enum-dep" d="M735 235 V205"/>
  <path class="enum-dep" d="M1055 455 V515"/>
  <path class="enum-dep" d="M1890 560 V585"/>
  <path class="enum-dep" d="M2110 560 V585"/>
  <!-- UML legend -->
  <rect class="legend-box" x="1515" y="1025" width="980" height="265" rx="8"/>
  <text class="legend-title" x="2005" y="1085" text-anchor="middle">Légende UML</text>
  <line class="assoc" x1="1580" y1="1130" x2="1700" y2="1130"/>
  <text class="legend-text" x="1750" y="1136">Flèche pleine : association / référence</text>
  <line class="comp" x1="1580" y1="1190" x2="1700" y2="1190"/>
  <text class="legend-text" x="1750" y="1196">Losange plein : composition / contient</text>
  <line class="dep" x1="2030" y1="1130" x2="2150" y2="1130"/>
  <text class="legend-text" x="2200" y="1136">Flèche pointillée : dépendance de support</text>
  <line class="soft" x1="2030" y1="1190" x2="2150" y2="1190"/>
  <text class="legend-text" x="2200" y="1196">1, 0..*, 1..* : multiplicités</text>
  <rect class="main-class" x="1580" y="1210" width="70" height="28" rx="3"/>
  <text class="legend-text" x="1675" y="1230">Classe métier principale</text>
  <rect class="support-class" x="1915" y="1210" width="70" height="28" rx="3"/>
  <text class="legend-text" x="2010" y="1230">Classe de support</text>
  <rect class="enum-class" x="2235" y="1210" width="70" height="28" rx="3"/>
  <text class="legend-text" x="2328" y="1230">Énumération</text>
  <line class="enum-dep" x1="1580" y1="1265" x2="1720" y2="1265"/>
  <text class="legend-text" x="1750" y="1271">Dépendance vers une énumération</text>
</svg>
