    <marker id="arrowBlue" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,5 L0,10 Z" fill="#2563eb"/></marker>
    <style>
      .page{fill:#fff}.frame{fill:#fff;stroke:#111827;stroke-width:2}.title{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#111827}
      .h1{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;fill:#111827}.h2{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#111827}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#111827}.small{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#374151}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#374151}
      .server{fill:#fff;stroke:#111827;stroke-width:2.4}.stack{fill:#fff;stroke:#94a3b8;stroke-width:2}.app{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.data{fill:#faf5ff;stroke:#9333ea;stroke-width:2}.ia{fill:#ecfdf5;stroke:#16803c;stroke-width:2}.dev{fill:#fff7ed;stroke:#f97316;stroke-width:2}.volume{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8}
      .black{stroke:#111827;stroke-width:2.4;fill:none;marker-end:url(#arrowBlack)}.orange{stroke:#f97316;stroke-width:2.4;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowOrange)}.green{stroke:#16803c;stroke-width:2.4;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowGreen)}.purple{stroke:#9333ea;stroke-width:2.2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowPurple)}.purpleLine{stroke:#9333ea;stroke-width:2.2;fill:none;stroke-dasharray:8 8}.blue{stroke:#2563eb;stroke-width:2.2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowBlue)}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#111827}.actor{stroke:#111827;stroke-width:2.5;fill:none}
    </style>
