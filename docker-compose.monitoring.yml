version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: jira_prometheus
    ports:
      - "9099:9090"
    volumes:
      # Monte le fichier local prometheus.yml de la racine
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Volume nommé pour conserver l'historique des métriques
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: jira_grafana
    ports:
      - "3009:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # Monte votre dossier local grafana/provisioning (dashboards + datasources)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Volume nommé pour conserver la base de données Grafana
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    external: true
    name: jira_migration_app_network

volumes:
  prometheus_data:
  grafana_data: