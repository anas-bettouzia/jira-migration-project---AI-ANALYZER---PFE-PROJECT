version: "3.9"

x-common-env: &common-env
  MONGO_URI: ${MONGO_URI}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
  GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  OLLAMA_URL: ${OLLAMA_URL}
  REDIS_URL: ${REDIS_URL}
  PARSING_SERVICE_URL: "http://parsing-service:5001"
  COMPATIBILITY_SERVICE_URL: "http://compatibility-service:5002"
  KNOWLEDGE_SERVICE_URL: "http://knowledge-service:5003"
  REPORT_SERVICE_URL: "http://report-service:5004"
  WORKER_URL: "http://worker:5005"
  WORKER_UPLOAD_DIR: ${WORKER_UPLOAD_DIR:-/app/tmp_uploads}
  FRONTEND_URL: ${FRONTEND_URL}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  SMTP_USE_TLS: ${SMTP_USE_TLS}
  SMTP_USE_SSL: ${SMTP_USE_SSL}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  SENDGRID_FROM: ${SENDGRID_FROM}
  ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY}
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: ${PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION}
  FLASK_ENV: ${FLASK_ENV}
  FLASK_RUN_HOST: ${FLASK_RUN_HOST:-0.0.0.0}
  GEMINI_MODEL: ${GEMINI_MODEL}
  TRUSTED_HOSTS: "docker.itspectrum.fr,docker.itspectrum.fr:5001,parsing-service,parsing-service:5001,compatibility-service,compatibility-service:5002,knowledge-service,knowledge-service:5003,report-service,report-service:5004,worker,worker:5005,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
  DEBUG: ${DEBUG}
  RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}

services:

  gateway:
    build:
      context: ./back
      target: gateway
    container_name: gateway
    ports:
      - "88:5000"
    environment:
      <<: *common-env
      PORT: 5000
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  parsing_service:
    build:
      context: ./back
      target: parsing_service
    container_name: parsing_service
    ports:
      - "5001:5001"
    environment:
      <<: *common-env
      PORT: 5001
    networks:
      default:
        aliases:
          - parsing-service
          - parsing_service
    depends_on:
      - mongodb
    restart: unless-stopped

  compatibility_service:
    build:
      context: ./back
      target: compatibility_service
    container_name: compatibility_service
    ports:
      - "5002:5002"
    environment:
      <<: *common-env
      PORT: 5002
    networks:
      default:
        aliases:
          - compatibility-service
          - compatibility_service
    depends_on:
      - mongodb
      - knowledge_service
    restart: unless-stopped

  knowledge_service:
    build:
      context: ./back
      dockerfile: knowledge_service/Dockerfile
    container_name: knowledge_service
    ports:
      - "5003:5003"
    environment:
      <<: *common-env
      PORT: 5003
    networks:
      default:
        aliases:
          - knowledge-service
          - knowledge_service
    volumes:
      - knowledge_chroma_data:/app/knowledge_service/chroma_db
    depends_on:
      - mongodb
    restart: unless-stopped

  report_service:
    build:
      context: ./back
      target: report_service
    container_name: report_service
    ports:
      - "5004:5004"
    volumes:
      - report_generated_files:/app/report_service/generated_reports
    environment:
      <<: *common-env
      PORT: 5004
    networks:
      default:
        aliases:
          - report-service
          - report_service
    depends_on:
      - mongodb
      - knowledge_service
    restart: unless-stopped

  worker:
    build:
      context: ./back
      target: worker
    container_name: worker
    ports:
      - "5005:5005"
    environment:
      <<: *common-env
      PORT: 5005
    volumes:
      - worker_uploads:/app/tmp_uploads
    depends_on:
      - redis
      - mongodb
      - parsing_service
      - compatibility_service
      - report_service
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    container_name: frontend
    ports:
      - "83:80"
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: mongo_db
    # ports:
    #   - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      default:
        aliases:
          - mongodb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongo_express:
    image: mongo-express:latest
    container_name: mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: spectrum_admin
      ME_CONFIG_BASICAUTH_PASSWORD: AnasSuperMotDePasseWeb123
    depends_on:
      - mongodb
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    expose:
      - "11434"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1 
    restart: unless-stopped

  sonar_scanner:
    build:
      context: .
      dockerfile: Dockerfile.sonar
    container_name: sonar_scanner
    environment:
      - SONAR_TOKEN=${SONAR_TOKEN}
    command:
      - "-Dsonar.host.url=http://docker.itspectrum.fr:9000"
      - "-Dsonar.projectKey=PFE_jira-migration---ai-analyzer_98acf2e0-9f71-4550-97a7-e92112f7e2a9" 
      - "-Dsonar.token=${SONAR_TOKEN}"
      - "-Dsonar.sources=."
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      default:
        aliases:
          - prometheus
    restart: unless-stopped
    depends_on:
      - gateway
      - parsing_service
      - compatibility_service
      - knowledge_service
      - report_service
      - worker

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      default:
        aliases:
          - grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  mongo_data:
    external: false
    name: jira_migration_mongo_data
  ollama_data:
    external: false
    name: jira_migration_ollama_data
  redis_data:
    external: false
    name: jira_migration_redis_data
  knowledge_chroma_data:
    external: false
    name: jira_migration_knowledge_chroma_data
  report_generated_files:
    external: false
    name: jira_migration_report_generated_files
  worker_uploads:
    external: false
    name: jira_migration_worker_uploads
  prometheus_data:
    external: false
    name: jira_migration_prometheus_data
  grafana_data:
    external: false
    name: jira_migration_grafana_data
