api:
  insecure: false

entryPoints:
  web:
    address: :80
  websecure:
    address: :443

certificatesResolvers:
  le:
    acme:
      email: ${LETSENCRYPT_EMAIL}
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

providers:
  file:
    filename: /etc/traefik/routes.yaml
    watch: true
