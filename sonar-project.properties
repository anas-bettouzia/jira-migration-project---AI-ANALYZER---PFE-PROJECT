sonar.projectKey=jira-migration-ai-analyzer
sonar.projectName=Jira Migration AI Analyzer
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10
sonar.typescript.tsconfigPaths=front/tsconfig.sonar.json
sonar.sources=back/gateway,back/parsing_service,back/compatibility_service,back/knowledge_service,back/report_service,back/shared,back/worker,front/src
sonar.tests=back/tests

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/venv/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/generated_reports/**,\
  **/chroma_db/**,\
  **/temp_uploads/**,\
  **/assets/img/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.webp,\
  front/package-lock.json

sonar.test.exclusions=\
  **/node_modules/**,\
  **/venv/**

# Coverage will be enabled once Bamboo generates Python and frontend reports.
sonar.coverage.exclusions=**

# Enable these once automated coverage reports are generated in Bamboo.
# sonar.python.coverage.reportPaths=back/coverage.xml
# sonar.javascript.lcov.reportPaths=front/coverage/lcov.info

# SonarQube 9.9 does not recognize the Tailwind CSS v4 @custom-variant directive.
# The i18n file contains user-facing password labels, not credentials.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=front/src/index.css
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=front/src/i18n/index.tsx

sonar-host-url=http://docker.itspectrum.fr:9000 
